# ARM64 optimisation for Raspberry Pi 5 (Cortex-A76) and Apple Silicon.
# x86_64 settings for CI and server deployments.
#
# Architecture-specific flags live under [target.*] only — debug builds keep
# default codegen (fast compile). Release LTO/strip: [profile.release] below.

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=cortex-a76",
    "-C", "target-feature=+neon,+aes,+sha2,+crc",
]

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "target-cpu=apple-m1",
    "-C", "target-feature=+neon,+aes,+sha2,+sha3,+crc",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "target-cpu=x86-64-v3",
    "-C", "target-feature=+aes,+sse4.2,+avx,+avx2",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
