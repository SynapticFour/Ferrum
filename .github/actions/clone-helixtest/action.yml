name: Clone HelixTest
description: Clone HelixTest at HELIXTEST_REF (branch, tag, or commit SHA)
inputs:
  ref:
    description: Branch, tag, or commit SHA
    required: true
  dest:
    description: Destination directory
    required: false
    default: helixtest-repo
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        REF="${{ inputs.ref }}"
        DEST="${{ inputs.dest }}"
        REPO="https://github.com/${GITHUB_REPOSITORY_OWNER}/HelixTest.git"
        rm -rf "$DEST"
        if [[ "$REF" =~ ^(main|master)$ ]] || [[ "$REF" =~ ^v[0-9] ]]; then
          git clone --depth 1 --branch "$REF" "$REPO" "$DEST"
        else
          git clone --depth 1 "$REPO" "$DEST"
          git -C "$DEST" fetch --depth 1 origin "$REF"
          git -C "$DEST" checkout FETCH_HEAD
        fi
        echo "HelixTest @ $(git -C "$DEST" rev-parse --short HEAD)"
