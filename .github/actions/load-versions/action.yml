name: Load VERSIONS.lock
description: Export cross-repo pins from VERSIONS.lock into GITHUB_ENV
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        file="${{ github.workspace }}/VERSIONS.lock"
        if [[ ! -f "$file" ]]; then
          echo "VERSIONS.lock not found at $file" >&2
          exit 1
        fi
        while IFS= read -r line || [[ -n "$line" ]]; do
          line="${line%%#*}"
          line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ -z "$line" ]] && continue
          echo "$line" >> "$GITHUB_ENV"
        done < "$file"
        echo "Loaded pins from VERSIONS.lock"
