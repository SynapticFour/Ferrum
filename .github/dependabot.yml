# Weekly dependency updates. Grouped so one PR per ecosystem per week, not one per crate.
# Rust toolchain (MSRV 1.91.1) stays pinned in rust-toolchain.toml; bump that by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      rust-security:
        applies-to: security-updates
        patterns: ["*"]
      rust-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      # Major bumps change APIs; do those in a reviewed PR against MSRV.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      ui-security:
        applies-to: security-updates
        patterns: ["*"]
      ui-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/deploy, /services/ui]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      base-images:
        patterns: ["*"]
