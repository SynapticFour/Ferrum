version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github_actions_all:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # Bulk action bumps closed without merge — bump workflows manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
