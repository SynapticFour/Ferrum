name: CI

on:
  push:
  pull_request:

env:
  RUN_MII_CONNECT: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace

  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace --all-targets
      - name: Run MII Connect validation (optional)
        if: env.RUN_MII_CONNECT == 'true'
        run: |
          cargo run -p ferrum-cli -- mii validate \
            --input profiles/mii/samples/default17-bundle.json \
            --manifest profiles/mii/manifest.json \
            --strict \
            --output mii-conformance-report.json
      - name: Upload MII Connect report (optional)
        if: always() && env.RUN_MII_CONNECT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mii-conformance-report
          path: mii-conformance-report.json

  test-laptop-mode:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run ferrum-embed laptop mode tests (isolated network)
        run: |
          if command -v unshare >/dev/null 2>&1; then
            unshare --net cargo test -p ferrum-embed || cargo test -p ferrum-embed
          else
            cargo test -p ferrum-embed
          fi
      - name: Build optimized laptop gateway + CLI
        run: |
          ./scripts/build-laptop-native.sh --no-native-cpu
          cargo build -p ferrum-cli
      - name: E2E ferrum demo start --offline
        run: bash deploy/scripts/ci-laptop-demo-e2e.sh

  # Lesson 8: keep benchmark targets and optional features compiling (no full bench run in CI).
  bench-and-features:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libdeflate (for ferrum-core --features libdeflate)
        run: sudo apt-get update && sudo apt-get install -y libdeflate-dev
      - run: cargo bench -p ferrum-bench --no-run
      - run: cargo bench -p ferrum-crypt4gh --bench crypt_benchmark --no-run
      - run: cargo check -p ferrum-storage --features opendal
      - run: cargo check -p ferrum-core --features libdeflate
      - run: cargo check -p ferrum-drs --features bam-lazy-ingest
      - run: cargo check -p ferrum-mii-connect

  build-arm64:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build workspace (aarch64 release)
        run: cargo build --workspace --target aarch64-unknown-linux-gnu --release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: ARM64 gateway binary size check
        run: |
          BIN=target/aarch64-unknown-linux-gnu/release/ferrum-gateway
          if [ ! -f "$BIN" ]; then
            echo "::error::Missing $BIN"
            exit 1
          fi
          SIZE=$(stat -c%s "$BIN")
          echo "ferrum-gateway (aarch64 release): $SIZE bytes"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "::warning::Binary exceeds 50MB Pi microSD target ($SIZE bytes)"
          fi

  benchmark-arm64:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install aarch64 cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compile Crypt4GH benchmarks (aarch64)
        run: cargo bench -p ferrum-crypt4gh --bench crypt_benchmark --no-run --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Compile ferrum-bench (aarch64)
        run: cargo bench -p ferrum-bench --no-run --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
