name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUN_MII_CONNECT: "false"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # GA4GH_INFRA_REF / HELIXTEST_REF: loaded from VERSIONS.lock per job
  # crates.io occasionally flakes in GHA (SSL_ERROR_SYSCALL); default cargo retry is 3.
  CARGO_NET_RETRY: "10"

jobs:
  # One Linux compile chain (Solum model): avoid parallel cold cargo jobs.
  rust:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/rust-deps
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          command: cargo clippy --workspace --all-targets -- -D warnings
      - name: Prove (offline)
        run: make prove
      - name: OpenAPI drift (named for the Actions UI)
        run: make openapi-check
      - name: Federated access smoke (ADS proxy + DRS/WES gates)
        run: bash deploy/scripts/ci-federated-e2e.sh
      - name: Run MII Connect validation (optional)
        if: env.RUN_MII_CONNECT == 'true'
        run: |
          cargo run -p ferrum-cli -- mii validate \
            --input profiles/mii/samples/default17-bundle.json \
            --manifest profiles/mii/manifest.json \
            --strict \
            --output mii-conformance-report.json
      - name: Upload MII Connect report (optional)
        if: always() && env.RUN_MII_CONNECT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mii-conformance-report
          path: mii-conformance-report.json

  ferrum-meta-schema:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - name: Clone ferrum-meta at pin
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/_ferrum-meta"
          REPO="https://github.com/${GITHUB_REPOSITORY_OWNER}/ferrum-meta.git"
          git clone --depth 1 "$REPO" "$DEST"
          git -C "$DEST" fetch --depth 1 origin "$FERRUM_META_SHA"
          git -C "$DEST" checkout --detach FETCH_HEAD
          echo "ferrum-meta @ $(git -C "$DEST" rev-parse --short HEAD)"
      - name: Vendored LinkML must match pin
        run: FERRUM_META_REPO="$GITHUB_WORKSPACE/_ferrum-meta" ./scripts/sync-ferrum-meta-schemas.sh --check

  test-edge-mode:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps
      - name: Run ferrum-embed Edge mode tests (isolated network)
        run: |
          if command -v unshare >/dev/null 2>&1; then
            unshare --net cargo test -p ferrum-embed || cargo test -p ferrum-embed
          else
            cargo test -p ferrum-embed
          fi
      - name: Build optimized edge gateway + CLI
        run: |
          ./scripts/build-edge-native.sh --no-native-cpu
          cargo build -p ferrum-cli
      - name: ferrum-meta validate fixtures
        run: |
          for f in profiles/meta/fixtures/*.yaml; do
            cargo run -p ferrum-cli -- meta validate --input "$f"
          done
      - name: E2E ferrum demo start --edge
        run: bash deploy/scripts/ci-edge-demo-e2e.sh
      - name: Field edge installer smoke (Phase 3)
        run: bash deploy/scripts/ci-field-edge-install-smoke.sh
      - name: Field sync E2E + beacon federation smoke (Phase 4)
        run: bash deploy/scripts/ci-field-sync-e2e.sh
      - name: Field pipeline E2E (Phase 5)
        run: bash deploy/scripts/ci-field-pipeline-e2e.sh
      - name: Field ops E2E (Phase 6)
        run: bash deploy/scripts/ci-field-ops-e2e.sh
      - name: Field ecosystem E2E (Phase 7)
        run: bash deploy/scripts/ci-field-ecosystem-e2e.sh

  # Lesson 8: keep benchmark targets and optional features compiling (no full bench run in CI).
  bench-and-features:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps
      - name: Install libdeflate (for ferrum-core --features libdeflate)
        run: sudo apt-get update && sudo apt-get install -y libdeflate-dev
      - run: cargo bench -p ferrum-bench --no-run
      - run: cargo bench -p ferrum-crypt4gh --bench crypt_benchmark --no-run
      - run: cargo check -p ferrum-storage --features opendal
      - run: cargo check -p ferrum-core --features libdeflate
      - run: cargo check -p ferrum-meta-connect

  # ARM + size budget: main / manual only (PR already covered by rust job on x86).
  build-arm64:
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps
      - name: Build ferrum-gateway (release-edge, ARM64)
        run: cargo build -p ferrum-gateway --features edge --profile release-edge
      - name: ARM64 gateway binary size check (50 MB budget)
        run: |
          BIN=target/release-edge/ferrum-gateway
          if [ ! -f "$BIN" ]; then
            echo "::error::Missing $BIN"
            exit 1
          fi
          SIZE=$(stat -c%s "$BIN")
          echo "ferrum-gateway (aarch64 release-edge): $SIZE bytes"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "::error::Binary exceeds 50MB Pi microSD target ($SIZE bytes)"
            exit 1
          fi

  benchmark-arm64:
    if: github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/rust-deps
      - name: Compile Crypt4GH benchmarks (aarch64)
        run: cargo bench -p ferrum-crypt4gh --bench crypt_benchmark --no-run
      - name: Compile ferrum-bench (aarch64)
        run: cargo bench -p ferrum-bench --no-run
      - name: Crypt4GH ARM64 quick throughput smoke (Pi target 500 MB/s documented)
        run: |
          cargo bench -p ferrum-crypt4gh --bench crypt_benchmark -- --quick 2>&1 | tee /tmp/crypt4gh-bench.log || true
          echo "See FIELD-OPS.md: Pi 5 field target is >500 MB/s; CI ARM runner is compile/smoke only."

  ui:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - name: Install UI dependencies
        working-directory: services/ui
        run: npm ci
      - name: Typecheck and build UI
        working-directory: services/ui
        run: npm run build
      - name: i18n key coverage
        working-directory: services/ui
        run: npm run check:i18n
      - name: Install Playwright Chromium
        working-directory: services/ui
        run: npx playwright install chromium --with-deps
      - name: UI E2E smoke
        working-directory: services/ui
        run: npm run test:e2e

  # Docker TES stack: main / manual only (cold image builds dominate minutes).
  test-tes:
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    name: Docker TES + pilot smoke (WES COMPLETE)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - name: Docker TES stack + pilot smoke
        run: |
          chmod +x deploy/scripts/ci-tes-pilot-e2e.sh
          bash deploy/scripts/ci-tes-pilot-e2e.sh

  # Supply-chain gate (org level-up C1–C2): licenses, sources, bans, advisories via deny.toml.
  # Native cargo-deny: optional git dep ga4gh-clearinghouse is allow-listed in deny.toml.
  supply-chain:
    if: github.actor != 'dependabot[bot]'
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/load-versions
      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          ver=0.20.2
          curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
          mv "cargo-deny-${ver}-x86_64-unknown-linux-musl/cargo-deny" "${CARGO_HOME:-$HOME/.cargo}/bin/"
          cargo deny --version
      - run: cargo deny check
