name: Build and publish Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      variants:
        description: "JSON array of gateway variants (full|edge|edge-infra|full-infra). Showcase pin is edge-infra. Dispatch default omits full-infra; pass [\"full-infra\"] to build only it. A v* tag publishes all four."
        required: false
        default: '["full","edge","edge-infra"]'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Gateway images are published for linux/amd64 and linux/arm64. Each architecture
  # builds natively (arm64 on ubuntu-24.04-arm; Rust under QEMU takes hours), pushes
  # by digest, and docker-gateway-merge joins both under the usual tags.
  docker-gateway:
    name: gateway ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.variants || '["full","edge","edge-infra","full-infra"]') }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/synapticfour/ferrum,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FERRUM_VARIANT=${{ matrix.variant }}
            FERRUM_GIT_SHA=${{ github.sha }}
            FERRUM_BUILD_PROFILE=${{ matrix.variant }}
          cache-from: type=gha,scope=ferrum-gateway-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ferrum-gateway-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Keep digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: gateway-digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-gateway-merge:
    name: gateway ${{ matrix.variant }} (publish)
    needs: docker-gateway
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.variants || '["full","edge","edge-infra","full-infra"]') }}
    steps:
      # Exact names: a pattern like gateway-digest-full-* also matches full-infra.
      - uses: actions/download-artifact@v4
        with:
          name: gateway-digest-${{ matrix.variant }}-amd64
          path: /tmp/digests
      - uses: actions/download-artifact@v4
        with:
          name: gateway-digest-${{ matrix.variant }}-arm64
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract gateway metadata
        id: meta_gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/synapticfour/ferrum
          tags: |
            type=raw,value=${{ github.sha }},enable=${{ matrix.variant == 'full' }}
            type=raw,value=${{ github.sha }}-${{ matrix.variant }}
            type=raw,value=latest,enable=${{ matrix.variant == 'full' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag,enable=${{ matrix.variant == 'full' }}
            type=ref,event=tag,suffix=-${{ matrix.variant }}

      - name: Publish multi-arch tags
        working-directory: /tmp/digests
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "expected 2 digests (amd64, arm64), got: $(ls)" >&2; exit 1; }
          tags="$(jq -r '.tags | map("-t " + .) | join(" ")' <<<"${DOCKER_METADATA_OUTPUT_JSON}")"
          # shellcheck disable=SC2086
          docker buildx imagetools create ${tags} $(printf 'ghcr.io/synapticfour/ferrum@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/synapticfour/ferrum:${{ github.sha }}-${{ matrix.variant }}"

  docker-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The UI builds its static files once on the runner's own platform
      # (FROM --platform=$BUILDPLATFORM); only the small nginx stage runs per
      # architecture, so QEMU costs seconds, not minutes.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract UI metadata
        id: meta_ui
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/synapticfour/ferrum-ui
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push UI image
        uses: docker/build-push-action@v7
        with:
          context: ./services/ui
          file: ./services/ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          cache-from: type=gha,scope=ferrum-ui
          cache-to: type=gha,mode=max,scope=ferrum-ui
