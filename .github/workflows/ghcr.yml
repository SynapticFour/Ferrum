name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  docker-gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, edge, edge-infra]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract gateway metadata
        id: meta_gateway
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/synapticfour/ferrum
          tags: |
            type=raw,value=${{ github.sha }},enable=${{ matrix.variant == 'full' }}
            type=raw,value=${{ github.sha }}-${{ matrix.variant }}
            type=raw,value=latest,enable=${{ matrix.variant == 'full' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag,enable=${{ matrix.variant == 'full' }}
            type=ref,event=tag,suffix=-${{ matrix.variant }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta_gateway.outputs.tags }}
          labels: ${{ steps.meta_gateway.outputs.labels }}
          build-args: |
            FERRUM_VARIANT=${{ matrix.variant }}
            FERRUM_GIT_SHA=${{ github.sha }}
            FERRUM_BUILD_PROFILE=${{ matrix.variant }}
          cache-from: type=gha,scope=ferrum-gateway-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=ferrum-gateway-${{ matrix.variant }}

  docker-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract UI metadata
        id: meta_ui
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/synapticfour/ferrum-ui
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push UI image
        uses: docker/build-push-action@v7
        with:
          context: ./services/ui
          file: ./services/ui/Dockerfile
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          cache-from: type=gha,scope=ferrum-ui
          cache-to: type=gha,mode=max,scope=ferrum-ui
