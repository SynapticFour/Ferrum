# Helix verify PILOT — do not merge this workflow onto Ferrum main.
# Stage 2: comment + regression-only fail. Not a required status check.
# Not GA4GH certification. Does not start ga4gh-infra. Demo compose, TES noop.
#
# Needs: SynapticFour/helix-action on GitHub, and Helix `helix-ref` that contains
# `helix verify` (local Helix is ahead of origin until those commits are pushed).

name: "PILOT: Helix verify (not main)"

on:
  push:
    branches: [ci/helix-verify-pilot]
  pull_request:
    branches: [ci/helix-verify-pilot]
  workflow_dispatch:
    inputs:
      helix_ref:
        description: SynapticFour/Helix ref that contains helix verify
        required: false
        default: "main"
      helixtest_ref:
        description: SynapticFour/HelixTest ref (sibling path dep)
        required: false
        default: "v0.1.3"

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: helix-verify-pilot-${{ github.ref }}
  cancel-in-progress: true

env:
  GATEWAY_BASE: http://localhost:8080
  FERRUM_PUBLIC_BASE_URL: http://localhost:8080
  RUST_BUILDER_IMAGE: public.ecr.aws/docker/library/rust:1.91.1-bookworm
  DEBIAN_RUNTIME_IMAGE: public.ecr.aws/docker/library/debian:bookworm-slim
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  helix-verify:
    if: github.actor != 'dependabot[bot]' && github.ref_name != 'main' && github.base_ref != 'main'
    name: Helix verify vs last successful pilot run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ferrum
        uses: actions/checkout@v7

      - name: PILOT notice
        run: |
          {
            echo "## Helix verify pilot — not GA4GH certification"
            echo "Branch \`${{ github.ref_name }}\` only. Do not merge this workflow onto \`main\`."
            echo "Job fails only on PASS → FAIL vs the last successful run of this workflow on the baseline branch."
            echo "Ferrum is a reference target, not a dependency. Not HELIOS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start Ferrum demo stack
        env:
          RUST_BUILDER_IMAGE: ${{ env.RUST_BUILDER_IMAGE }}
          DEBIAN_RUNTIME_IMAGE: ${{ env.DEBIAN_RUNTIME_IMAGE }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/docker-compose-build-retry.sh
          deploy/scripts/docker-compose-build-retry.sh -f deploy/docker-compose.yml build --no-cache ferrum-init ferrum-gateway
          docker compose -f deploy/docker-compose.yml up -d --build
          echo "Waiting for gateway /health (up to 120s)..."
          for i in $(seq 1 24); do
            if curl -sf "${GATEWAY_BASE}/health" >/dev/null; then
              echo "Gateway ready."
              break
            fi
            if [ "$i" -eq 24 ]; then
              docker compose -f deploy/docker-compose.yml logs ferrum-gateway 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 5
          done
          echo "Waiting for DRS test-object-1..."
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${GATEWAY_BASE}/ga4gh/drs/v1/objects/test-object-1" || echo "000")
            if [ "$code" = "200" ]; then
              echo "DRS test-object-1=200"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "DRS test-object-1 still ${code}"
              exit 1
            fi
            sleep 5
          done

      - name: Helix verify (regression vs baseline)
        uses: SynapticFour/helix-action@main
        with:
          endpoint: ${{ env.GATEWAY_BASE }}
          helix-ref: ${{ github.event.inputs.helix_ref || 'main' }}
          helixtest-ref: ${{ github.event.inputs.helixtest_ref || 'v0.1.3' }}
          baseline-branch: ci/helix-verify-pilot
          fail-on-regression: "true"
          comment: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop Ferrum stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v --remove-orphans || true
