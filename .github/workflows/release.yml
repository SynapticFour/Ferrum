name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Dry-run version label (e.g. v0.2.0-rc1) — creates draft release'
        required: true


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: ferrum-gateway-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: ferrum-gateway-aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: ferrum-gateway-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: ferrum-gateway-x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/load-versions

      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: cargo install cross --locked

      - name: Build (musl via cross, edge profile)
        if: contains(matrix.target, 'musl')
        run: cross build --profile release-edge -p ferrum-gateway --no-default-features --features edge --target ${{ matrix.target }}

      - name: Build (macOS native, edge profile)
        if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build --profile release-edge -p ferrum-gateway --no-default-features --features edge --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release-edge/ferrum-gateway release/
          cp scripts/install-field-edge.sh release/
          tar -czvf ${{ matrix.asset_name }}.tar.gz -C release ferrum-gateway install-field-edge.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Load VERSIONS.lock (before any builds)
        uses: ./.github/actions/load-versions

      - uses: ./.github/actions/clone-ga4gh-infra
        with:
          ref: ${{ env.GA4GH_INFRA_REF }}

      - name: Set release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "FERRUM_RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Release version: ${VERSION} (ga4gh-infra @ ${GA4GH_INFRA_REF})"

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect binary tarballs
        run: |
          for d in artifacts/*/; do
            [ -d "$d" ] && cp "$d"*.tar.gz . || true
          done
          ls -la ferrum-gateway-*.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Build offline bundle and Helm chart
        env:
          GA4GH_INFRA_REF: ${{ env.GA4GH_INFRA_REF }}
          FERRUM_RELEASE_VERSION: ${{ env.FERRUM_RELEASE_VERSION }}
        run: |
          chmod +x scripts/package_release_bundle.sh scripts/export_offline_bundle.sh import.sh
          ./scripts/package_release_bundle.sh

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --workspace --format json --output-file ferrum-sbom.cdx.json

      - name: Generate SHA256SUMS for all release artifacts
        run: |
          shasum -a 256 \
            ferrum-gateway-*.tar.gz \
            ferrum-offline-*.tar.gz \
            ferrum-helm-*.tgz \
            ferrum-sbom.cdx.json \
            VERSIONS.lock \
            install.sh \
            import.sh \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ env.FERRUM_RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            ferrum-gateway-*.tar.gz
            ferrum-offline-*.tar.gz
            ferrum-helm-*.tgz
            SHA256SUMS.txt
            ferrum-sbom.cdx.json
            VERSIONS.lock
            install.sh
            import.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
