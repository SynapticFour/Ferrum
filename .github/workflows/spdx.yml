name: SPDX

# First-party .rs must carry SPDX-License-Identifier.
# This is not a full REUSE.toml bill of materials (LICENSE stays BUSL-named).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  first-party-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX-License-Identifier on first-party Rust
        run: python3 scripts/spdx-rs.py . --license BUSL-1.1 --check
