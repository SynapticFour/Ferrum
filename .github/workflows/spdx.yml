name: SPDX

# First-party .rs must carry SPDX-License-Identifier.
# This is not a full REUSE.toml bill of materials. The identifier is Apache-2.0.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-party-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX-License-Identifier on first-party Rust
        run: python3 scripts/spdx-rs.py . --license Apache-2.0 --check
