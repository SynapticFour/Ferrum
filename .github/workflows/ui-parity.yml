name: UI parity

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Target profile
        required: true
        default: up-tes
        type: choice
        options:
          - up-tes
          - up-pilot-cloud
          - fly
      tier:
        description: Test tier (read or write)
        required: true
        default: read
        type: choice
        options:
          - read
          - write

jobs:
  ui-parity-up-tes:
    if: github.event.inputs.profile == 'up-tes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Clone ga4gh-infra
        uses: ./.github/actions/clone-ga4gh-infra

      - name: Start TES stack
        run: make up-tes

      - name: Seed pilot fixtures
        if: inputs.tier == 'write'
        run: make seed-pilot

      - name: UI parity (up-tes)
        run: make ui-parity-tes UI_PARITY_TIER=${{ inputs.tier }}

  ui-parity-fly:
    if: github.event.inputs.profile == 'fly' && vars.HOSTED_PILOT_FERRUM_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: UI parity (hosted Ferrum)
        env:
          FERRUM_PASSPORT_JWT: ${{ secrets.HOSTED_PILOT_FERRUM_PASSPORT_JWT }}
          FERRUM_URL: ${{ vars.HOSTED_PILOT_FERRUM_URL }}
          GA4GH_URL: ${{ vars.HOSTED_PILOT_GA4GH_URL }}
        run: make ui-parity-fly UI_PARITY_TIER=${{ inputs.tier }}

  ui-parity-pilot-cloud:
    if: github.event.inputs.profile == 'up-pilot-cloud' && vars.HOSTED_PILOT_GA4GH_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Clone ga4gh-infra
        uses: ./.github/actions/clone-ga4gh-infra

      - name: Check hosted broker reachable
        env:
          PILOT_CLOUD_GA4GH_URL: ${{ vars.HOSTED_PILOT_GA4GH_URL }}
        run: |
          curl -sf "${PILOT_CLOUD_GA4GH_URL}/service-info"

      - name: Start pilot-cloud stack
        env:
          PILOT_CLOUD_GA4GH_URL: ${{ vars.HOSTED_PILOT_GA4GH_URL }}
        run: make up-pilot-cloud

      - name: UI parity (up-pilot-cloud)
        env:
          FERRUM_PASSPORT_JWT: ${{ secrets.HOSTED_PILOT_FERRUM_PASSPORT_JWT }}
          PILOT_CLOUD_GA4GH_URL: ${{ vars.HOSTED_PILOT_GA4GH_URL }}
        run: make ui-parity-pilot-cloud UI_PARITY_TIER=${{ inputs.tier }}
