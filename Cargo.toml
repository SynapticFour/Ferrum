[workspace]
resolver = "2"
members = [
    "crates/ferrum-core",
    "crates/ferrum-storage",
    "crates/ferrum-drs",
    "crates/ferrum-trs",
    "crates/ferrum-wes",
    "crates/ferrum-tes",
    "crates/ferrum-passports",
    "crates/ferrum-crypt4gh",
    "crates/ferrum-beacon",
    "crates/ferrum-cohorts",
    "crates/ferrum-gateway",
    "crates/ferrum-workspaces",
    "crates/ferrum-security-tests",
    "crates/ferrum-htsget",
    "crates/ferrum-mii-connect",
    "crates/ferrum-embed",
    "crates/ferrum-ont",
    "crates/ferrum-federation",
    "crates/ferrum-reference",
    "tools/ferrum-cli",
    "crates/ferrum-bench",
]

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[profile.release-laptop]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
