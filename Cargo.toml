[workspace]
resolver = "2"
members = [
    "crates/ferrum-core",
    "crates/ferrum-storage",
    "crates/ferrum-drs",
    "crates/ferrum-trs",
    "crates/ferrum-wes",
    "crates/ferrum-tes",
    "crates/ferrum-passports",
    "crates/ferrum-crypt4gh",
    "crates/ferrum-beacon",
    "crates/ferrum-cohorts",
    "crates/ferrum-gateway",
    "crates/ferrum-workspaces",
    "crates/ferrum-security-tests",
    "crates/ferrum-htsget",
    "crates/ferrum-mii-connect",
    "crates/ferrum-meta-connect",
    "crates/ferrum-embed",
    "crates/ferrum-ont",
    "crates/ferrum-federation",
    "crates/ferrum-reference",
    "crates/ferrum-discovery",
    "tools/ferrum-cli",
    "crates/ferrum-bench",
]

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[profile.release-edge]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"

[profile.release-edge-perf]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# Deprecated alias — use release-edge (removed in a future release).
[profile.release-laptop]
inherits = "release-edge"

[patch.crates-io]
# Fork removes unmaintained rust-crypto (RUSTSEC-2022-0011); upstream crypt4gh 0.4.1 still pins it.
crypt4gh = { path = "third_party/crypt4gh" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
