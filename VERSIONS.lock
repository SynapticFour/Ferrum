# Ferrum ecosystem — cross-repo version pins
#
# WHO UPDATES THIS FILE
#   Release engineer when cutting a Ferrum release (see RELEASING.md):
#     1. Bump FERRUM_VERSION to the new v*.*.* tag.
#     2. Set GA4GH_INFRA_REF to a compatible ga4gh-infra git tag (ga4gh-infra-v*).
#     3. Set HELIXTEST_REF to a HelixTest tag (vX.Y.Z) or commit SHA.
#     4. Set SOLUM_REF / SOLUM_TAG / SOLUM_SHA to a Solum git tag when [solum] is in the cut.
#     5. Run CI on main, then tag and push Ferrum.
#   Also sync synapticfour-business pilot Dockerfiles / build-pilot-image.sh checks.
#
# WHO READS THIS FILE
#   - Ferrum CI (.github/workflows/* via load-versions action)
#   - deploy/docker-compose.yml (GA4GH_INFRA_REF build-arg)
#   - deploy/scripts/run-helixtest-local.sh
#   - synapticfour-business pilot-deploy (sources this file from sibling Ferrum/)

# Ferrum release tag (customer bundles, pilot FERRUM_REF)
FERRUM_VERSION=v0.3.1

# ga4gh-infra — separate download (decision: Option B). Git ref for clone/build.
# Tagged on origin 2026-08-15: ga4gh-infra-v0.2.3 → 613bd14932b57e30cfdca7b413841fe5b07a80fd
# (Docker Release publishes every Compose service as :0.2.3). Do not install ga4gh-infra-v0.1.0.
# Stack/deploy image tags follow ga4gh-infra-v* (0.2.3). Crate Cargo.toml may stay 0.1.0.
GA4GH_INFRA_REF=ga4gh-infra-v0.2.3
GA4GH_INFRA_TAG=ga4gh-infra-v0.2.3
GA4GH_INFRA_SHA=613bd14932b57e30cfdca7b413841fe5b07a80fd

# Docker image pins for ga4gh-infra compose (see ga4gh-infra/docker/.env.example)
GA4GH_INFRA_IMAGE_VERSION=0.2.3

# HelixTest — optional customer verification (decision: Option B, not in Ferrum bundle)
# Last tag v0.1.2 → 2c121187da00aebc57d7fcdcb8525507fcad9223 (DRS/Beacon schemas).
# Pin SHA (not a new tag): 9a078e4 — mock-idp authorize without following redirects
# (default reqwest followed 302 to broker /callback without RP cookie → 401).
HELIXTEST_REF=9a078e4e7fc08e70331c5166a9899451226c5251
HELIXTEST_TAG=v0.1.2
HELIXTEST_SHA=9a078e4e7fc08e70331c5166a9899451226c5251

# Solum — optional consent teeth on DRS/WES ([solum] / FERRUM_SOLUM__*). Fail-closed.
# First SemVer tag v0.1.0. Unset BASE_URL leaves Ferrum behaviour unchanged.
SOLUM_REF=v0.1.0
SOLUM_TAG=v0.1.0
SOLUM_SHA=b68a941ff1cc9a2406f25b27fed8f12368ebbf1b

# ferrum-meta — LinkML schema plane. Vendored into profiles/meta/schema/ and
# compiled into ferrum-meta-connect via include_str!. Refresh with
# scripts/sync-ferrum-meta-schemas.sh. Not a Ferrum runtime dependency.
FERRUM_META_REF=e34fce4920d249fa69109a6d0600123901832eba
FERRUM_META_SHA=e34fce4920d249fa69109a6d0600123901832eba
