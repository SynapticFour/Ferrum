[package]
name = "ferrum-bench"
version = "0.2.0"
edition = "2021"
publish = false
description = "Criterion benchmarks for Ferrum hot paths (compile with cargo bench -p ferrum-bench)"

[dependencies]
criterion = "0.8"
crypt4gh = "0.4"
ferrum-crypt4gh = { path = "../ferrum-crypt4gh" }
ferrum-storage = { path = "../ferrum-storage" }

[[bench]]
name = "crypt4gh_throughput"
harness = false

[[bench]]
name = "drs_multipart_plan"
harness = false
