[package]
name = "ferrum-core"
version = "0.2.0"
edition = "2021"
description = "Shared types, errors, config, and database abstractions for Ferrum"
license = "BUSL-1.1"

[features]
default = []
# Faster BGZF blocks via libdeflate (C lib). Re-exports `noodles-bgzf` when enabled.
libdeflate = ["dep:noodles-bgzf"]
openapi = ["utoipa"]
# GA4GH Passport validation via ga4gh-clearinghouse (ga4gh-infra integration).
clearinghouse = ["dep:ga4gh-clearinghouse"]

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
config = "0.14"
utoipa = { version = "4", optional = true }
jsonwebtoken = "9"
async-trait = "0.1"
ulid = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
url = "2"
regex = "1"
notify = "8.2.0"
rayon = "1.10"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
ga4gh-clearinghouse = { path = "../../../ga4gh-infra/crates/ga4gh-clearinghouse", optional = true }
noodles-bgzf = { version = "0.46", optional = true, default-features = false, features = [
    "libdeflate",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "migrate"] }
flate2 = "1"
tar = "0.4"
