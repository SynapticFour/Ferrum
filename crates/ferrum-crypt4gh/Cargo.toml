[package]
name = "ferrum-crypt4gh"
version = "0.2.0"
edition = "2021"
description = "Crypt4GH encryption layer and DRS proxy"
license = "BUSL-1.1"

[dependencies]
ferrum-core = { path = "../ferrum-core" }
axum = "0.7"
tokio.workspace = true
tower = "0.4"
tower-service = "0.3"
http-body-util = "0.1"
http = "1"
http-body = "1"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6", features = ["axum"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
crypt4gh = "0.4"
# Crypt4GH uses X25519 + ChaCha20-Poly1305 (via the `crypt4gh` crate / RustCrypto).
# With `.cargo/config.toml` `+neon` on aarch64, ChaCha20-Poly1305 uses SIMD intrinsics.
# Crypt4GH does NOT use AES-GCM for payload encryption; `+aes` helps SHA2/AES-adjacent
# RustCrypto paths and future at-rest layers — verify with `cargo bench -p ferrum-crypt4gh`.
async-trait = "0.1"
bytes = "1"
dashmap = "5"
futures-util = "0.3"
parking_lot = "0.12"
base64 = "0.22"
thiserror = "1"
anyhow = "1"

[[bin]]
name = "ferrum-crypt4gh"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "ferrum-node-keygen"
path = "src/bin/node_keygen.rs"

[features]
default = []
standalone = ["tracing-subscriber"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "header_rewrap"
harness = false

[[bench]]
name = "crypt_benchmark"
harness = false
