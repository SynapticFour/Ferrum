[package]
name = "ferrum-discovery"
version = "0.1.0"
edition = "2021"
description = "GA4GH Service Registry client and auto-registration for Ferrum"
license = "BUSL-1.1"

[dependencies]
ferrum-core = { path = "../ferrum-core" }
ga4gh-types = { path = "../../../ga4gh-infra/crates/ga4gh-types" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock = "0.6"
