[package]
name = "ferrum-embed"
version = "0.1.0"
edition = "2021"
description = "Embedded SQLite and local storage backends for offline / laptop Ferrum deployments"
license = "BUSL-1.1"

[dependencies]
async-trait = "0.1"
ferrum-core = { path = "../ferrum-core" }
ferrum-storage = { path = "../ferrum-storage" }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "migrate", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
axum = "0.7"

[dev-dependencies]
ferrum-drs = { path = "../ferrum-drs" }
ferrum-beacon = { path = "../ferrum-beacon" }
ferrum-gateway = { path = "../ferrum-gateway" }
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
hyper = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
