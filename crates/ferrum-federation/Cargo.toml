[package]
name = "ferrum-federation"
version = "0.2.0"
edition = "2021"
description = "P2P federated Beacon queries for Ferrum"
license = "BUSL-1.1"

[dependencies]
ferrum-core = { path = "../ferrum-core", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tracing = "0.1"
url = "2"
thiserror = "1"

[dev-dependencies]
axum = { version = "0.7", features = ["json"] }
ferrum-beacon = { path = "../ferrum-beacon" }
ferrum-core = { path = "../ferrum-core" }
http = "1"
hyper = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio.workspace = true
tower = { version = "0.4", features = ["util"] }
serde_json = "1"
