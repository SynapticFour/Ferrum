[package]
name = "ferrum-gateway"
version = "0.2.0"
edition = "2021"
description = "API Gateway routing to all GA4GH services"
license = "BUSL-1.1"

[[bin]]
name = "ferrum-gateway"
path = "src/main.rs"

[features]
default = ["full"]
# Slim embedded / Laptop Mode binary: DRS + Beacon + htsget + Crypt4GH on SQLite only.
laptop = []
# Full production stack (Postgres-backed WES/TES/TRS/Passports, optional Swagger deps).
full = [
    "postgres",
    "wes",
    "tes",
    "trs",
    "passports",
    "cohorts",
    "workspaces",
    "swagger",
    "discovery",
]
postgres = ["sqlx/postgres"]
wes = ["dep:ferrum-wes", "ferrum-wes/discovery"]
tes = ["dep:ferrum-tes"]
trs = ["dep:ferrum-trs"]
passports = ["dep:ferrum-passports"]
cohorts = ["dep:ferrum-cohorts"]
workspaces = ["dep:ferrum-workspaces"]
swagger = ["dep:utoipa", "dep:utoipa-swagger-ui"]
standalone = []
tes-docker = ["ferrum-tes/docker", "tes"]
workspaces_email = ["workspaces", "ferrum-workspaces/email"]
discovery = ["dep:ferrum-discovery"]
# ga4gh-infra co-deploy: clearinghouse visa validation + service-registry auto-registration.
external-auth = ["ferrum-core/clearinghouse", "discovery"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ferrum-core = { path = "../ferrum-core" }
ferrum-embed = { path = "../ferrum-embed" }
ferrum-storage = { path = "../ferrum-storage" }
ferrum-drs = { path = "../ferrum-drs" }
ferrum-htsget = { path = "../ferrum-htsget" }
ferrum-beacon = { path = "../ferrum-beacon" }
ferrum-federation = { path = "../ferrum-federation" }
ferrum-reference = { path = "../ferrum-reference" }
ferrum-crypt4gh = { path = "../ferrum-crypt4gh" }
ferrum-discovery = { path = "../ferrum-discovery", optional = true }
ferrum-wes = { path = "../ferrum-wes", optional = true }
ferrum-tes = { path = "../ferrum-tes", optional = true }
ferrum-trs = { path = "../ferrum-trs", optional = true }
ferrum-passports = { path = "../ferrum-passports", optional = true }
ferrum-cohorts = { path = "../ferrum-cohorts", optional = true }
ferrum-workspaces = { path = "../ferrum-workspaces", optional = true }
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "4", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "6", features = ["axum"], optional = true }
tokio-util = "0.7"
http-body-util = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
axum = "0.7"
ferrum-core = { path = "../ferrum-core" }
ferrum-drs = { path = "../ferrum-drs" }
ferrum-storage = { path = "../ferrum-storage" }
serde_json = "1"
tempfile = "3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
http = "1"
