[package]
name = "ferrum-ont"
version = "0.3.0"
edition = "2021"
description = "Oxford Nanopore (ONT) ingestion types and helpers for Ferrum"
license = "BUSL-1.1"

[dependencies]
ferrum-core = { path = "../ferrum-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "migrate", "json"] }
ferrum-drs = { path = "../ferrum-drs" }
ferrum-beacon = { path = "../ferrum-beacon" }
ferrum-storage = { path = "../ferrum-storage" }
tempfile = "3"
axum = { version = "0.7", features = ["json", "multipart"] }
tower = { version = "0.4", features = ["util"] }
http = "1"
hyper = "1"
ulid = "1"
