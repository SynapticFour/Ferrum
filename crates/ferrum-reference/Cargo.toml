[package]
name = "ferrum-reference"
version = "0.2.0"
edition = "2021"
description = "Pluggable reference genome registry for Ferrum"
license = "BUSL-1.1"

[dependencies]
ferrum-core = { path = "../ferrum-core", default-features = false }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite"] }

[dev-dependencies]
ferrum-beacon = { path = "../ferrum-beacon" }
ferrum-drs = { path = "../ferrum-drs" }
ferrum-wes = { path = "../ferrum-wes" }
axum = { version = "0.7", features = ["json"] }
http = "1"
http-body-util = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio.workspace = true
tower = { version = "0.4", features = ["util"] }
