[package]
name = "ferrum-storage"
version = "0.3.0"
edition = "2021"
description = "Object storage backends (local POSIX, S3) for Ferrum"
license = "BUSL-1.1"

[features]
default = []
opendal = ["dep:opendal"]

[dev-dependencies]
tokio.workspace = true

[dependencies]
anyhow = "1"
ferrum-core = { path = "../ferrum-core" }
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-smithy-types = "1"
bytes = "1"
tokio.workspace = true
opendal = { version = "0.55", optional = true, default-features = false, features = [
    "services-s3",
    "services-fs",
    "services-memory",
] }
