# Lightweight demo stack for install.sh / `ferrum demo start` (pre-built images, no local build).
# Full stack with SeaweedFS S3, Keycloak, init seeding: clone the repo and run `make demo`.
# Digests: docs/COMPOSE-IMAGE-PINS.md
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: ferrum-demo
      POSTGRES_DB: ferrumdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrum"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    # Pin to VERSIONS.lock FERRUM_VERSION + digest. Multi-arch index: linux/amd64 and linux/arm64.
    image: ghcr.io/synapticfour/ferrum:v0.3.13-full-infra@sha256:bfef9ecfa72fbd641fa19a464186796e329ba0808761c5dc00f3b86a53c7d658
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ferrum:ferrum-demo@postgres/ferrumdb
      FERRUM_ENVIRONMENT: demo
      FERRUM_JWT_SECRET: demo-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: ghcr.io/synapticfour/ferrum-ui:v0.3.13@sha256:ead8237a7ca619b8bf74fe46a938174408812710e8df99c62f9a267748f21521
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - gateway

  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "8082:80"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - ui
