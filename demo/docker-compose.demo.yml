# Lightweight demo stack for install.sh / `ferrum demo start` (pre-built images, no local build).
# Full stack with MinIO, Keycloak, init seeding: clone the repo and run `make demo`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: ferrum-demo
      POSTGRES_DB: ferrumdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrum"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    # Pin to VERSIONS.lock FERRUM_VERSION. :latest is not a pin.
    image: ghcr.io/synapticfour/ferrum:v0.3.2
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://ferrum:ferrum-demo@postgres/ferrumdb
      FERRUM_ENVIRONMENT: demo
      FERRUM_JWT_SECRET: demo-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    # Pin to VERSIONS.lock FERRUM_VERSION. :latest is not a pin.
    image: ghcr.io/synapticfour/ferrum-ui:v0.3.2
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - gateway

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - ui
