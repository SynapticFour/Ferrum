# Demo stack reverse proxy (install.sh / demo/docker-compose.demo.yml)
upstream gateway {
    server gateway:8080;
}
upstream ui {
    server ui:3000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    location /health { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /ga4gh/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /workspaces/v1/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /cohorts/v1/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /api/v1/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /admin/ { proxy_pass http://gateway; proxy_http_version 1.1; proxy_set_header Host $host; }
    location /objects/ {
        proxy_pass http://gateway/ga4gh/drs/v1/objects/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
