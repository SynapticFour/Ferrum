[graph]
targets            = []
exclude-unpublished = true

[advisories]
yanked       = "warn"
unmaintained = "workspace"
ignore       = [
    # zip 0.6.6 is a build-dep of utoipa-swagger-ui 6 (vendored UI zip unpack at compile time only).
    # Runtime WES zip is 9.0.4. Revisit when utoipa-swagger-ui drops zip 0.6.
    { id = "RUSTSEC-2026-0367", reason = "utoipa-swagger-ui 6 build-only zip 0.6.6; no runtime extract of untrusted ZIPs" },
    { id = "RUSTSEC-2026-0368", reason = "utoipa-swagger-ui 6 build-only zip 0.6.6; no runtime extract of untrusted ZIPs" },
    { id = "RUSTSEC-2026-0369", reason = "utoipa-swagger-ui 6 build-only zip 0.6.6; no runtime extract of untrusted ZIPs" },
    { id = "RUSTSEC-2026-0429", reason = "utoipa-swagger-ui 6 build-only zip 0.6.6; no runtime extract of untrusted ZIPs" },
    { id = "RUSTSEC-2026-0545", reason = "utoipa-swagger-ui 6 build-only zip 0.6.6; no AES-encrypted ZIPs are read" },
    { id = "RUSTSEC-2026-0548", reason = "utoipa-swagger-ui 6 build-only zip 0.6.6; ZipStreamReader not used on untrusted input" },
]

[licenses]
version               = 2
confidence-threshold  = 0.8
# Apache-2.0 is Ferrum's own licence. GPL/AGPL/LGPL are not in the allow list.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
# Workspace crates (Ferrum) are Apache-2.0 and private; only check dependencies
[licenses.private]
ignore = true

[[licenses.clarify]]
name          = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# No license in Cargo.toml; Fuchsia project uses BSD-3-Clause
[[licenses.clarify]]
name       = "fuchsia-cprng"
version    = "0.1.1"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0xf04ece33 }]

[bans]
multiple-versions = "warn"
# Workspace path crates commonly use `version = "*"` for internal deps; warn until pinned.
wildcards         = "warn"
highlight         = "all"
deny              = []
skip              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = ["https://github.com/SynapticFour/ga4gh-infra"]
