# Guided pilot / customer-facing profile — auth ON.
# Demo defaults (`deploy/configs/local.toml`, `make up`) use require_auth=false
# and are NON-PILOT. Use this file (or production.toml) for pilot evidence.
#
# Example:
#   FERRUM_CONFIG=deploy/configs/pilot.toml
# Point jwt_issuer / jwt_jwks_url at ga4gh-infra (or your IdP) before go-live.
# See docs/customer-runbook.md § Auth honesty and docs/GA4GH-INFRA-INTEGRATION.md.

bind = "0.0.0.0:8080"

[database]
driver = "postgres"
postgres_host = "postgres"
postgres_port = 5432
postgres_db = "ferrum"
postgres_user = "ferrum"
# postgres_password via FERRUM_DATABASE__POSTGRES_PASSWORD or FERRUM_DATABASE__URL

[auth]
# jwt_issuer = "https://auth.example.com"
# jwt_jwks_url = "https://auth.example.com/.well-known/jwks.json"
require_auth = true

[services]
enable_drs = true
enable_trs = true
enable_wes = true
enable_tes = true
enable_passports = true
enable_crypt4gh = true
enable_beacon = true

[metadata_store]
enabled = true
