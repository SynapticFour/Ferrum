# Nightly / CI overlay: guided-pilot auth ON, HelixTest stubs OFF.
# Merge with docker-compose.yml. HMAC JWT via FERRUM_AUTH__JWT_SECRET
# (same value used to mint TEST_BEARER). Do not set HELIXTEST_SKIP_AUTH.
#
#   FERRUM_AUTH__JWT_SECRET=… docker compose \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.pilot-auth-ci.yml up -d
#
# This is standalone Ferrum + HS256, not ga4gh-infra JWKS (`make up-pilot-local`).
# Public DRS objects stay readable without a visa; TES/WES list/get fail closed.

services:
  ferrum-gateway:
    volumes:
      - ./configs/pilot.toml:/etc/ferrum/pilot.toml:ro
    environment:
      FERRUM_CONFIG: /etc/ferrum/pilot.toml
      FERRUM_AUTH__REQUIRE_AUTH: "true"
      FERRUM_TES_HELIXTEST_STUB: "false"
      FERRUM_WES_HELIXTEST_STUBS: "false"
      FERRUM_AUTH__JWT_SECRET: "${FERRUM_AUTH__JWT_SECRET:?set FERRUM_AUTH__JWT_SECRET}"
      # Empty so HS256 CI tokens are not checked against Keycloak JWKS.
      FERRUM_AUTH__JWKS_URL: ""
      FERRUM_AUTH__ISSUER: ""
      FERRUM_AUTH__AUDIENCE: ""
