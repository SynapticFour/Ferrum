# Default pilot overlay: local Ferrum + hosted ga4gh-infra / Keycloak AAI (no local broker stack).
#
#   make up-pilot          # default — same as make up-pilot-cloud
#   make up-pilot-cloud
#
# Requires: PILOT_CLOUD_GA4GH_URL pointing at a reachable ga4gh-infra (JWT issuer / JWKS).

services:
  ferrum-gateway:
    build:
      context: ${GA4GH_INFRA_SRC}/..
      dockerfile: Ferrum/deploy/Dockerfile.gateway-monorepo
      args:
        FERRUM_GATEWAY_FEATURES: full,tes-docker,external-auth,discovery
        FERRUM_GIT_SHA: ${FERRUM_GIT_SHA:-unknown}
        FERRUM_BUILD_PROFILE: pilot-cloud
    environment:
      FERRUM_AUTH__MODE: external
      FERRUM_AUTH__REQUIRE_AUTH: "true"
      FERRUM_AUTH__CLEARINGHOUSE: "true"
      FERRUM_AUTH__ISSUER: ${PILOT_CLOUD_GA4GH_URL:?set PILOT_CLOUD_GA4GH_URL}
      FERRUM_AUTH__JWKS_URL: ${PILOT_CLOUD_GA4GH_URL:?set PILOT_CLOUD_GA4GH_URL}/jwks.json
      FERRUM_TES_HELIXTEST_STUB: "false"
      FERRUM_WES_HELIXTEST_STUBS: "false"
      FERRUM_PUBLIC_BROKER_URL: ${PILOT_CLOUD_GA4GH_URL:?set PILOT_CLOUD_GA4GH_URL}
      FERRUM_BROKER_LOGIN_IDP: keycloak
      FERRUM_SERVICES__ENABLE_PASSPORTS: "false"
      FERRUM_DISCOVERY__ENABLED: "true"
      FERRUM_DISCOVERY__AUTO_REGISTER: "${PILOT_CLOUD_AUTO_REGISTER:-true}"
      FERRUM_DISCOVERY__SERVICE_REGISTRY_URL: ${PILOT_CLOUD_GA4GH_URL:?set PILOT_CLOUD_GA4GH_URL}
      FERRUM_DISCOVERY__REGISTRATION_BASE_URL: http://localhost:${GATEWAY_PORT:-8080}
      SERVICE_REGISTRY_REGISTRATION_KEY: ${SERVICE_REGISTRY_REGISTRATION_KEY:-}

  ferrum-ui:
    environment:
      VITE_API_BASE: ""
