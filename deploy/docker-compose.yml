# Ferrum local demo - single command: docker compose up
# Services: gateway, postgres, minio, keycloak, ferrum-ui, init
# Usage: make demo  (or: docker compose -f deploy/docker-compose.yml up -d)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferrum}
      POSTGRES_DB: ${POSTGRES_DB:-ferrum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferrum} -d ${POSTGRES_DB:-ferrum}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    # MinIO image is minimal (no curl/mc); init script waits with nc
    restart: unless-stopped

  keycloak:
    image: keycloak/keycloak:26.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 exposes health on port 9000, not 8080
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  ferrum-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.init
      args:
        GA4GH_INFRA_REF: ${GA4GH_INFRA_REF:-ga4gh-infra-v0.2.3}
    image: ferrum-init:${FERRUM_VERSION:-latest}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ferrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferrum}
      POSTGRES_DB: ${POSTGRES_DB:-ferrum}
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ferrum}
      # DRS access_url in seeded objects (microbench); match gateway public URL for clients
      GATEWAY_PUBLIC_URL: ${FERRUM_PUBLIC_BASE_URL:-http://localhost:8080}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      CRYPT4GH_KEY_DIR: /data/ferrum/keys
      CRYPT4GH_MASTER_KEY_ID: node
      # Optional dev-only: FERRUM_INIT_RESET_MIGRATIONS=1 clears _ferrum_init_migrations (see init-demo.sh)
    volumes:
      - crypt4gh-keys:/data/ferrum/keys
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      keycloak: { condition: service_healthy }
    restart: "no"

  ferrum-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      args:
        RUST_BUILDER_IMAGE: ${RUST_BUILDER_IMAGE:-rust:1.91.1-bookworm}
        DEBIAN_RUNTIME_IMAGE: ${DEBIAN_RUNTIME_IMAGE:-debian:bookworm-slim}
        FERRUM_GIT_SHA: ${FERRUM_GIT_SHA:-unknown}
        FERRUM_BUILD_PROFILE: ${FERRUM_BUILD_PROFILE:-demo}
        GA4GH_INFRA_REF: ${GA4GH_INFRA_REF:-ga4gh-infra-v0.2.3}
    image: ferrum-gateway:${FERRUM_VERSION:-latest}
    pull_policy: build
    environment:
      FERRUM_BIND: "0.0.0.0:8080"
      FERRUM_DATABASE__URL: "postgres://${POSTGRES_USER:-ferrum}:${POSTGRES_PASSWORD:-ferrum}@postgres:5432/${POSTGRES_DB:-ferrum}"
      # Init container runs migrations and seeds; gateway must not re-run (would DROP and wipe seeds)
      FERRUM_DATABASE__RUN_MIGRATIONS: "false"
      FERRUM_STORAGE__BACKEND: s3
      FERRUM_STORAGE__S3_ENDPOINT: "http://minio:9000"
      FERRUM_STORAGE__S3_REGION: us-east-1
      FERRUM_STORAGE__S3_BUCKET: ${MINIO_BUCKET:-ferrum}
      FERRUM_STORAGE__S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      FERRUM_STORAGE__S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FERRUM_AUTH__JWKS_URL: "${KEYCLOAK_JWKS_URL:-http://localhost:8081/realms/ferrum/protocol/openid-connect/certs}"
      # CI sets these via env for HelixTest auth; local demo defaults stay open.
      FERRUM_AUTH__REQUIRE_AUTH: "${FERRUM_AUTH__REQUIRE_AUTH:-false}"
      FERRUM_AUTH__JWT_SECRET: "${FERRUM_AUTH__JWT_SECRET:-}"
      FERRUM_AUTH__ISSUER: "${FERRUM_AUTH__ISSUER:-}"
      # NON-PILOT demo only: HelixTest lifecycle stubs (TES hello-tes, WES synthetic trs://).
      # Pilot/production overlays must leave these unset or false.
      FERRUM_TES_HELIXTEST_STUB: "${FERRUM_TES_HELIXTEST_STUB:-true}"
      FERRUM_WES_HELIXTEST_STUBS: "${FERRUM_WES_HELIXTEST_STUBS:-true}"
      # WES→TES, htsget tickets, DRS self-URIs — must match the host:port clients use (not https://localhost).
      FERRUM_PUBLIC_BASE_URL: "${FERRUM_PUBLIC_BASE_URL:-http://localhost:8080}"
      FERRUM_WES_TRS_AUTO_REGISTER: "${FERRUM_WES_TRS_AUTO_REGISTER:-true}"
      # Service discovery: resolve TES/TRS via registry when co-deployed; fall back to local gateway paths.
      FERRUM_DISCOVERY__ENABLED: "${FERRUM_DISCOVERY__ENABLED:-true}"
      FERRUM_DISCOVERY__REGISTRATION_BASE_URL: "http://localhost:${GATEWAY_PORT:-8080}"
      FERRUM_ENCRYPTION__CRYPT4GH_KEY_DIR: /data/ferrum/keys
      FERRUM_ENCRYPTION__CRYPT4GH_MASTER_KEY_ID: node
    volumes:
      - crypt4gh-keys:/data/ferrum/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      ferrum-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

  ferrum-ui:
    build:
      context: ../services/ui
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_PROBLEM_REPORT: "${VITE_ENABLE_PROBLEM_REPORT:-true}"
        VITE_PROBLEM_REPORT_EMAIL: "${VITE_PROBLEM_REPORT_EMAIL:-contact@synapticfour.com}"
        VITE_PROBLEM_REPORT_GITHUB_REPO: "${VITE_PROBLEM_REPORT_GITHUB_REPO:-SynapticFour/Ferrum}"
    image: ferrum-ui:${FERRUM_VERSION:-latest}
    pull_policy: build
    depends_on:
      ferrum-gateway: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${UI_PORT:-8082}:80"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ferrum-gateway: { condition: service_healthy }
      ferrum-ui: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:
  keycloak-data:
  crypt4gh-keys:
