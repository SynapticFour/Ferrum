# Ferrum local demo — gateway + Postgres + SeaweedFS (S3) + Keycloak + UI + init.
# Usage: make demo  (or: $(deploy/scripts/compose-cmd.sh) -f deploy/docker-compose.yml up -d)
# Object store: SeaweedFS Apache-2.0 — see docs/TESTED-S3-BACKENDS.md (MinIO is BYO only).
# Image digests: docs/COMPOSE-IMAGE-PINS.md

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferrum}
      POSTGRES_DB: ${POSTGRES_DB:-ferrum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferrum} -d ${POSTGRES_DB:-ferrum}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Reference S3: SeaweedFS 3.80 (Apache-2.0). Auto-creates bucket on Put.
  object-store:
    image: chrislusf/seaweedfs:3.80@sha256:1055999e08eed1789b0ae45d235126e4495e23d3fb9d6396293fd42539b1ae6a
    platform: linux/amd64
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
    volumes:
      - object-store-data:/data
      - ./object-store/seaweed-s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  keycloak:
    image: keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # Keycloak 26 exposes health on port 9000, not 8080
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  ferrum-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.init
      args:
        GA4GH_INFRA_REF: ${GA4GH_INFRA_REF:-ga4gh-infra-v0.2.6}
        RUST_BUILDER_IMAGE: ${RUST_BUILDER_IMAGE:-rust:1.91.1-alpine@sha256:45c1c35cd364b8055e9e86f8ecd3e8c874b2dcb658d8a4f94b5d111aa0d651a2}
    image: ferrum-init:${FERRUM_VERSION:-latest}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ferrum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferrum}
      POSTGRES_DB: ${POSTGRES_DB:-ferrum}
      # S3-compatible object store (SeaweedFS). Legacy MINIO_* names still accepted by init-demo.sh.
      S3_HOST: object-store
      S3_PORT: 8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ferrum}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ferrumsecretkey123}
      S3_BUCKET: ${S3_BUCKET:-ferrum}
      MINIO_HOST: object-store
      MINIO_PORT: 8333
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ferrum}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ferrumsecretkey123}
      MINIO_BUCKET: ${S3_BUCKET:-ferrum}
      GATEWAY_PUBLIC_URL: ${FERRUM_PUBLIC_BASE_URL:-http://localhost:8080}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      CRYPT4GH_KEY_DIR: /data/ferrum/keys
      CRYPT4GH_MASTER_KEY_ID: node
    volumes:
      - crypt4gh-keys:/data/ferrum/keys
    depends_on:
      postgres: { condition: service_healthy }
      object-store: { condition: service_started }
      keycloak: { condition: service_healthy }
    restart: "no"

  ferrum-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
      args:
        RUST_BUILDER_IMAGE: ${RUST_BUILDER_IMAGE:-rust:1.91.1-bookworm@sha256:c1e5f19e773b7878c3f7a805dd00a495e747acbdc76fb2337a4ebf0418896b33}
        DEBIAN_RUNTIME_IMAGE: ${DEBIAN_RUNTIME_IMAGE:-debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587}
        FERRUM_GIT_SHA: ${FERRUM_GIT_SHA:-unknown}
        FERRUM_BUILD_PROFILE: ${FERRUM_BUILD_PROFILE:-demo}
        GA4GH_INFRA_REF: ${GA4GH_INFRA_REF:-ga4gh-infra-v0.2.6}
    image: ferrum-gateway:${FERRUM_VERSION:-latest}
    pull_policy: build
    environment:
      FERRUM_BIND: "0.0.0.0:8080"
      FERRUM_DATABASE__URL: "postgres://${POSTGRES_USER:-ferrum}:${POSTGRES_PASSWORD:-ferrum}@postgres:5432/${POSTGRES_DB:-ferrum}"
      FERRUM_DATABASE__RUN_MIGRATIONS: "false"
      FERRUM_STORAGE__BACKEND: s3
      FERRUM_STORAGE__S3_ENDPOINT: "http://object-store:8333"
      FERRUM_STORAGE__S3_REGION: us-east-1
      FERRUM_STORAGE__S3_BUCKET: ${S3_BUCKET:-ferrum}
      FERRUM_STORAGE__S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ferrum}
      FERRUM_STORAGE__S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ferrumsecretkey123}
      FERRUM_AUTH__JWKS_URL: "${KEYCLOAK_JWKS_URL:-http://localhost:8081/realms/ferrum/protocol/openid-connect/certs}"
      FERRUM_AUTH__REQUIRE_AUTH: "${FERRUM_AUTH__REQUIRE_AUTH:-false}"
      FERRUM_AUTH__JWT_SECRET: "${FERRUM_AUTH__JWT_SECRET:-}"
      FERRUM_AUTH__ISSUER: "${FERRUM_AUTH__ISSUER:-}"
      FERRUM_TES_HELIXTEST_STUB: "${FERRUM_TES_HELIXTEST_STUB:-true}"
      FERRUM_WES_HELIXTEST_STUBS: "${FERRUM_WES_HELIXTEST_STUBS:-true}"
      FERRUM_PUBLIC_BASE_URL: "${FERRUM_PUBLIC_BASE_URL:-http://localhost:8080}"
      FERRUM_WES_TRS_AUTO_REGISTER: "${FERRUM_WES_TRS_AUTO_REGISTER:-true}"
      FERRUM_DISCOVERY__ENABLED: "${FERRUM_DISCOVERY__ENABLED:-true}"
      FERRUM_DISCOVERY__REGISTRATION_BASE_URL: "http://localhost:${GATEWAY_PORT:-8080}"
      FERRUM_ENCRYPTION__CRYPT4GH_KEY_DIR: /data/ferrum/keys
      FERRUM_ENCRYPTION__CRYPT4GH_MASTER_KEY_ID: node
    volumes:
      - crypt4gh-keys:/data/ferrum/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      object-store: { condition: service_started }
      ferrum-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped

  ferrum-ui:
    build:
      context: ../services/ui
      dockerfile: Dockerfile
      args:
        VITE_ENABLE_PROBLEM_REPORT: "${VITE_ENABLE_PROBLEM_REPORT:-true}"
        VITE_PROBLEM_REPORT_EMAIL: "${VITE_PROBLEM_REPORT_EMAIL:-contact@synapticfour.com}"
        VITE_PROBLEM_REPORT_GITHUB_REPO: "${VITE_PROBLEM_REPORT_GITHUB_REPO:-SynapticFour/Ferrum}"
    image: ferrum-ui:${FERRUM_VERSION:-latest}
    pull_policy: build
    depends_on:
      ferrum-gateway: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    ports:
      - "${UI_PORT:-8082}:80"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ferrum-gateway: { condition: service_healthy }
      ferrum-ui: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  object-store-data:
  keycloak-data:
  crypt4gh-keys:
