# Single-node / k3s / local Kubernetes — Ferrum v0.3.2
replicaCount: 1
image:
  repository: ghcr.io/synapticfour/ferrum
  tag: "v0.3.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ferrum.local
      paths:
        - path: /
          pathType: Prefix

config:
  database:
    url: "postgres://ferrum:ferrum@postgres:5432/ferrum"
    run_migrations: true
  storage:
    backend: s3
    s3_endpoint: "http://minio:9000"
    s3_region: us-east-1
    s3_bucket: ferrum
  auth:
    require_auth: false
  services:
    enable_drs: true
    enable_htsget: true
    enable_wes: true
    enable_tes: true
    enable_beacon: true
    enable_trs: true

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
