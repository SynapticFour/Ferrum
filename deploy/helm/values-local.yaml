# Single-node / k3s / local Kubernetes — Ferrum v0.3.5 tip / proposed v0.3.6
# Object store: point at SeaweedFS (or BYO S3). See docs/TESTED-S3-BACKENDS.md.
replicaCount: 1
image:
  repository: ghcr.io/synapticfour/ferrum
  tag: "v0.3.5-full-infra"
  digest: "sha256:555f44bada386bd58d7b6914a94b22e4bd5319edf5d4e70c11c7a82dae14c312"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ferrum.local
      paths:
        - path: /
          pathType: Prefix

config:
  database:
    url: "postgres://ferrum:ferrum@postgres:5432/ferrum"
    run_migrations: true
  storage:
    backend: s3
    # Reference: SeaweedFS S3 API (Compose service name object-store). Not MinIO.
    s3_endpoint: "http://object-store:8333"
    s3_region: us-east-1
    s3_bucket: ferrum
    s3_access_key_id: ferrum
    s3_secret_access_key: ferrumsecretkey123
  auth:
    require_auth: false
  services:
    enable_drs: true
    enable_htsget: true
    enable_wes: true
    enable_tes: true
    enable_beacon: true
    enable_trs: true

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi
