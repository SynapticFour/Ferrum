# Multi-node / HPC Kubernetes — Ferrum v0.3.2
replicaCount: 2
image:
  repository: ghcr.io/synapticfour/ferrum
  tag: "v0.3.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ferrum.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - ferrum.example.com
      secretName: ferrum-tls

existingSecret: ferrum-secrets

config:
  database:
    run_migrations: true
  storage:
    backend: s3
    s3_region: us-east-1
  auth:
    require_auth: true
    jwks_url: "https://auth.example.com/realms/ferrum/protocol/openid-connect/certs"
  services:
    enable_drs: true
    enable_htsget: true
    enable_wes: true
    enable_tes: true
    enable_beacon: true
    enable_trs: true

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
