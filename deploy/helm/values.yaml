# Ferrum Helm defaults — chart version tracks the Ferrum release tag (0.3.2).
# Copy values.yaml.example for a filled-in overlay. Do not ship :latest.

replicaCount: 1

image:
  repository: ghcr.io/synapticfour/ferrum
  tag: "v0.3.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ferrum.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Use an existing Secret for DB URL / S3 keys instead of generating from values.
existingSecret: ""

config:
  bind: "0.0.0.0:8080"
  database:
    url: ""
    run_migrations: true
  storage:
    backend: local
    base_path: /data/objects
    s3_endpoint: ""
    s3_region: us-east-1
    s3_bucket: ""
    s3_access_key_id: ""
    s3_secret_access_key: ""
  auth:
    require_auth: true
    jwks_url: ""
  services:
    enable_drs: true
    enable_htsget: true
    enable_wes: true
    enable_tes: true
    enable_beacon: true
    enable_trs: true
  # Lab Kit adapters map onto these (empty = Ferrum defaults).
  wesBackend: ""
  tesBackend: ""
  wesSlurmPartition: ""
  tesSlurmPartition: ""

persistence:
  enabled: false
  size: 20Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
