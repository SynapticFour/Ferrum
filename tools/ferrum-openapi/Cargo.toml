[package]
name = "ferrum-openapi"
version = "0.3.2"
edition = "2021"
license = "BUSL-1.1"
description = "Dump the committed Ferrum OpenAPI contract from utoipa types"
publish = false

[[bin]]
name = "ferrum-openapi"
path = "src/main.rs"

[dependencies]
