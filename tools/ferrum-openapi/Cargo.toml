ferrum-cohorts = { path = "../../crates/ferrum-cohorts" }
ferrum-crypt4gh = { path = "../../crates/ferrum-crypt4gh" }
ferrum-drs = { path = "../../crates/ferrum-drs" }
ferrum-htsget = { path = "../../crates/ferrum-htsget" }
ferrum-passports = { path = "../../crates/ferrum-passports" }
ferrum-tes = { path = "../../crates/ferrum-tes" }
ferrum-trs = { path = "../../crates/ferrum-trs" }
ferrum-wes = { path = "../../crates/ferrum-wes" }
utoipa = "4"
